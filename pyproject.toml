[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sdax-hamilton"
version = "0.1.0"
description = "Checked Hamilton declarations and resource lifecycles over SDAX"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["sdax==0.7.2", "apache-hamilton==1.90.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/owebeeone/sdax-hamilton"
Documentation = "https://github.com/owebeeone/sdax-hamilton/blob/main/docs/API.md"
Issues = "https://github.com/owebeeone/sdax-hamilton/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/sdax_hamilton"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
# Match the active interpreter; CI checks every supported Python version.
# A forced 3.11 target cannot parse dependencies' 3.12-only stubs on 3.12+.
ignore_missing_imports = true
check_untyped_defs = true
