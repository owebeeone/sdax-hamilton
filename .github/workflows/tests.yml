name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install '.[test]'
      - name: Lint
        run: python -m ruff check --no-cache src tests examples
      - name: Check package and authoring types
        run: python -m mypy src/sdax_hamilton tests/typing/authoring.py
      - name: Test installed package
        run: python -m pytest -q -p no:cacheprovider
