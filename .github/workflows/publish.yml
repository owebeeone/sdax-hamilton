name: Release artifacts

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          ref = os.environ["RELEASE_REF"]
          if ref.startswith("refs/tags/") and ref != f"refs/tags/v{version}":
              raise SystemExit(f"Tag {ref} does not match package version {version}")
          PY
      - name: Build sdist and wheel from sdist
        run: |
          python -m pip install 'build>=1.2,<2' 'twine>=7,<8'
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  test-wheel:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Install built wheel and its test dependencies
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          wheel, = Path("dist").glob("*.whl")
          subprocess.run([sys.executable, "-m", "pip", "install", f"{wheel}[test]"], check=True)
          PY
      - name: Verify installed version and source isolation
        run: |
          python -I - <<'PY'
          import tomllib
          from importlib.metadata import version
          from pathlib import Path
          import sdax_hamilton
          expected = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert version("sdax-hamilton") == expected
          assert not Path(sdax_hamilton.__file__).is_relative_to(Path.cwd())
          PY
      - name: Lint and check authoring types
        run: |
          python -m ruff check --no-cache src tests examples
          python -m mypy src/sdax_hamilton tests/typing/authoring.py
      - name: Test release wheel
        run: |
          python -I -m pytest -q -p no:cacheprovider tests
          python -I examples/lifecycle.py

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-wheel]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
