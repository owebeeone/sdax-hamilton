name: Release artifacts

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate release tag
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          ref = os.environ["RELEASE_REF"]
          tag = os.environ["RELEASE_TAG"]
          if tag and tag != f"v{version}":
              raise SystemExit(f"Release tag {tag} does not match package version {version}")
          if ref.startswith("refs/tags/") and ref != f"refs/tags/v{version}":
              raise SystemExit(f"Tag {ref} does not match package version {version}")
          PY
      - name: Build sdist and wheel from sdist
        run: |
          python -m pip install 'build>=1.2,<2' 'twine>=7,<8'
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  test-wheel:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        profile: [base]
        include:
          - python-version: "3.12"
            profile: pandas
          - python-version: "3.12"
            profile: polars
          - python-version: "3.12"
            profile: pydantic
          - python-version: "3.12"
            profile: pandera
          - python-version: "3.12"
            profile: spark
    env:
      SDAX_HAMILTON_TEST_PROFILE: ${{ matrix.profile }}
      PYARROW_IGNORE_TIMEZONE: "1"
      SPARK_LOCAL_IP: "127.0.0.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Install built wheel and its test dependencies
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          wheel, = Path("dist").glob("*.whl")
          profile = os.environ["SDAX_HAMILTON_TEST_PROFILE"]
          extras = "test" if profile == "base" else f"test,test-{profile}"
          subprocess.run([sys.executable, "-m", "pip", "install", f"{wheel}[{extras}]"], check=True)
          PY
      - name: Install full Java 21 runtime for local Spark
        if: matrix.profile == 'spark'
        run: |
          sudo apt-get update
          sudo apt-get install --yes openjdk-21-jdk-headless
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"
          echo "PYSPARK_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Verify installed version and source isolation
        run: |
          python -I - <<'PY'
          import tomllib
          from importlib.metadata import version
          from pathlib import Path
          import sdax_hamilton
          expected = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert version("sdax-hamilton") == expected
          assert sdax_hamilton.__version__ == expected
          assert not Path(sdax_hamilton.__file__).is_relative_to(Path.cwd())
          PY
      - name: Lint and check authoring types
        if: matrix.profile == 'base'
        run: |
          python -m ruff check --no-cache src tests examples
          python -m mypy src/sdax_hamilton tests/typing/authoring.py
      - name: Test release wheel
        run: |
          python -I -m pytest -q -p no:cacheprovider tests
          python -I examples/lifecycle.py

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build, test-wheel]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
